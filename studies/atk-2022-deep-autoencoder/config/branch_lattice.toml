schema_version = 1
paper_sha256 = "f3098e0c27ee19b27bea026aedc3d10e5dbb0c46f5cd01ed5bd5c05b7dcf850f"
model_seeds = [11, 22, 33]
screen_seed_count = 3
search_seed_count = 1
confirm_seed_count = 3
paper_sequential_search_evaluations = 86
corrected_nested_search_evaluations = 12
screen_data_fraction = 0.10
screen_epochs = 3
budget_uncertainty_multiplier = 2.0

[hyperparameter_envelope]
mode = "sequential_one_dimension_at_a_time"
batch_size = ["32", "512"]
epochs = ["10", "30", "100"]
stopping = ["fixed", "early_no_refit", "early_refit"]
learning_rate_multiplier = ["0.1", "1.0", "10.0"]
note = "Table-I architecture/optimizer choices remain fixed inside a semantic branch; omitted training parameters use the finite sequential envelope."

[paper_hyperparameter_search]
source = "Algorithm 6 and Sec. IV-C"
initial_optimizer = "SGD"
initial_dropout = "0"
initial_hidden_activation = "relu"
initial_output_activation = "softmax"
depth = ["2", "3", "4", "5"]
neurons = ["100", "200", "300", "400", "500"]
optimizer = ["SGD", "Adam", "Adamax", "Rmsprop"]
dropout = ["0", "0.2", "0.4", "0.5"]
hidden_activation = ["relu", "sigmoid", "linear", "tanh"]
output_activation = ["softmax", "sigmoid"]
interpretations = [
  "literal_uniform_width_36_evaluations",
  "per_layer_coordinate_86_evaluations",
  "direct_table_i_replay_for_tables_ii_v",
]
selection = ["maximum_dr_first_tie", "maximum_dr_then_minimum_fa"]
budget_uses = "per_layer_coordinate_86_evaluations"

