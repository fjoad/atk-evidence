schema_version = 2

# One entry per paper, in the order the website shows them (the active study
# first). The homepage card for each paper uses `title`, `authors`, `venue`,
# `year`, `card_status` and `card_summary`; the paper's page is rendered from
# `<path>/README.md` and its full research log from `<path>/RESEARCH_LOG.md`.
#
# `status` and `verdict` are legacy fields from the earlier process, kept so old
# values stay interpretable. Their vocabulary:
#
#   not-attempted            no work started
#   in-progress              work under way, no verdict issued
#   reproduced               the complete reported result pattern was recovered
#   partially-reproduced     some reported results recovered, others not
#   not-reproduced           not recovered within the finite tested space; this
#                            is bounded by that space and is NOT a claim that
#                            reproduction is impossible
#   internally-inconsistent  the reported numbers contradict each other or the
#                            paper's own stated protocol, independent of any
#                            implementation
#   unattainable-as-printed  stronger: no valid confusion matrix (or equivalent
#                            construction) on the described protocol yields the
#                            printed numbers, AND the deviation is systematic
#                            rather than consistent with rounding or isolated
#                            transcription error
#   no-consistent-protocol   an exhaustive, pre-registered search over
#                            measurement protocols (test-set sizes, class
#                            prevalences and common metric definitions) finds no
#                            single protocol that reproduces the reported table,
#                            and most individual cells are unreachable under every
#                            protocol searched. This is a statement about the
#                            published table, not about how it was produced.

