schema_version = 2

# Verdict vocabulary. A verdict is assigned only when the listed evidentiary bar
# is met; it is never inferred from suspicion or from a failure to reproduce.
#
#   not-attempted            no work started
#   in-progress              work under way, no verdict issued
#   reproduced               the complete reported result pattern was recovered
#   partially-reproduced     some reported results recovered, others not
#   not-reproduced           not recovered within the finite tested space; this
#                            is bounded by that space and is NOT a claim that
#                            reproduction is impossible
#   internally-inconsistent  the reported numbers contradict each other or the
#                            paper's own stated protocol, independent of any
#                            implementation
#   unattainable-as-printed  stronger: no valid confusion matrix (or equivalent
#                            construction) on the described protocol yields the
#                            printed numbers, AND the deviation is systematic
#                            rather than consistent with rounding or isolated
#                            transcription error
#   no-consistent-protocol   strongest rung. An exhaustive, pre-registered search
#                            over measurement protocols -- any test-set size, any
#                            class prevalence, and the common metric-definition
#                            variants -- finds NO single protocol that reproduces
#                            the reported table, and most individual cells are
#                            unreachable under every protocol searched. The
#                            likelihood of the table under "these were measured"
#                            is then zero rather than small, for the whole
#                            searched space. This is a statement about the
#                            artefact. It does not distinguish deliberate
#                            fabrication from catastrophic process failure (for
#                            example placeholder values never replaced); that
#                            distinction needs evidence outside the paper, and
#                            this project does not assert it.

