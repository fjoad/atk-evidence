page = "site/papers/takiddin-2021-robust-poisoning/index.html"
card_status = "In progress"
card_summary = "The printed training loss can't work as written, and three of the main model's result rows can't all be true at once. Most simpler models work on our data; the paper's main model hasn't reproduced."

