name: tests

on:
  push:
  pull_request:

jobs:
  deterministic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: studies/atk-2022-deep-autoencoder/requirements-lock.txt
      - run: python -m pip install --requirement studies/atk-2022-deep-autoencoder/requirements-lock.txt
      - run: PYTHON_BIN=python bash scripts/test.sh
