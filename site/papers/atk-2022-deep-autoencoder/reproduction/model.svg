<path d="M170 45H455 M558 45H839" fill="none" stroke="#225c65"/>
<text x="57" y="101" font-size="14">Input</text><text x="967" y="101" font-size="14">Reconstruction</text>
<g fill="#f1f0eb" stroke="#9ca49b">
<rect x="20" y="125" width="74" height="74" rx="3"/>
<rect x="930" y="125" width="74" height="74" rx="3"/>
</g>
