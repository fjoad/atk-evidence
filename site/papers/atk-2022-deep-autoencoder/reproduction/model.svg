<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" role="img" aria-labelledby="title description">
<title id="title">FC-SAE implemented for the Table III reproduction</title>
<desc id="description">A 48-value daily profile passes through encoder widths 400, 300, 200, 100 and decoder widths 100, 200, 300, 400 to a 48-value Softmax reconstruction. Each of the eight hidden layers uses sigmoid activation and dropout 0.4 during training. The reconstruction is compared with the input using mean squared error. The drawing shows layer order, not neuron-level connections.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#69736b"/></marker></defs>
<rect width="1040" height="330" fill="#fff"/>
