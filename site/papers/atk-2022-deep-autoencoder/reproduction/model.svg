<text x="515" y="289" font-size="14">Eight hidden layers · Sigmoid · Dropout 0.4 during training</text>
<text x="515" y="314" font-size="14" fill="#60675f">Training: reconstruct benign profiles · Test: alarm when mean squared error &gt; 0.58</text>
