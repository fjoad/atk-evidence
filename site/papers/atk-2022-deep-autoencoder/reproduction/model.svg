<rect x="335" y="112" width="55" height="100" rx="3"/>
<rect x="420" y="129" width="55" height="66" rx="3"/>
</g>
<g fill="#edf0e6" stroke="#5b7050">
<rect x="555" y="129" width="55" height="66" rx="3"/>
<rect x="640" y="112" width="55" height="100" rx="3"/>
<rect x="725" y="92" width="55" height="140" rx="3"/>
<rect x="810" y="67" width="55" height="190" rx="3"/>
</g>
<g stroke="#69736b" marker-end="url(#arrow)" fill="none">
<path d="M96 162H155"/><path d="M222 162H240"/><path d="M307 162H325"/><path d="M392 162H410"/>
<path d="M477 162H545"/><path d="M612 162H630"/><path d="M697 162H715"/><path d="M782 162H800"/><path d="M867 162H920"/>
</g>
<g font-size="16">
<text x="57" y="169">48</text><text x="192.5" y="169">400</text><text x="277.5" y="169">300</text><text x="362.5" y="169">200</text><text x="447.5" y="169">100</text>
